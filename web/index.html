<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Life TV</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="font-sans">
    <main class="grid min-h-screen content-start gap-9 px-[72px] pt-12 pb-[72px]">
      <header class="flex items-baseline justify-between">
        <p class="font-display m-0 text-[42px] tracking-[0.28em] text-brass uppercase">Life TV</p>
        <p id="hint" class="m-0 text-[22px] tracking-[0.08em] text-mute">← → ↑ ↓ · Enter · Esc</p>
      </header>
      <section
        id="home"
        class="grid grid-cols-[repeat(4,minmax(200px,1fr))] gap-7"
        aria-label="Início"
      ></section>
      <section id="catalog" class="grid min-h-[420px] grid-cols-[280px_1fr] gap-8" hidden></section>
      <section id="player" class="border-2 border-line bg-panel p-12" hidden></section>
      <section id="settings" hidden>
        <h1 class="font-display m-0 mb-2 text-[40px]">Ajustes</h1>
        <p class="mb-6 max-w-[40ch] text-[22px] text-mute">
          Playlist própria. Sem MAC, sem VPN, sem catálogo de terceiros.
        </p>
        <form id="playlistForm" class="grid max-w-[640px] gap-[18px]">
          <label class="grid gap-2 text-[20px] text-mute"
            >Nome
            <input
              id="plName"
              name="name"
              autocomplete="off"
              class="border-2 border-line bg-well px-4 py-3.5 font-sans text-2xl text-ink"
            />
          </label>
          <label class="grid gap-2 text-[20px] text-mute"
            >Portal
            <input
              id="plPortal"
              name="portal"
              placeholder="http://servidor:8080"
              class="border-2 border-line bg-well px-4 py-3.5 font-sans text-2xl text-ink"
            />
          </label>
          <label class="grid gap-2 text-[20px] text-mute"
            >Usuário
            <input
              id="plUser"
              name="username"
              autocomplete="off"
              class="border-2 border-line bg-well px-4 py-3.5 font-sans text-2xl text-ink"
            />
          </label>
          <label class="grid gap-2 text-[20px] text-mute"
            >Senha
            <input
              id="plPass"
              name="password"
              type="password"
              autocomplete="current-password"
              class="border-2 border-line bg-well px-4 py-3.5 font-sans text-2xl text-ink"
            />
          </label>
          <label class="grid gap-2 text-[20px] text-mute"
            >Portais para descobrir (um por linha)
            <textarea
              id="plCandidates"
              name="candidates"
              rows="3"
              placeholder="http://servidor-a.com&#10;http://servidor-b.com"
              class="border-2 border-line bg-well px-4 py-3.5 font-sans text-2xl text-ink"
            ></textarea>
          </label>
          <div class="flex gap-4">
            <button
              type="submit"
              class="cursor-pointer border-2 border-brass bg-transparent px-[22px] py-3.5 font-sans text-2xl text-brass"
            >
              Guardar XC
            </button>
            <button
              type="button"
              id="discoverBtn"
              class="cursor-pointer border-2 border-brass bg-transparent px-[22px] py-3.5 font-sans text-2xl text-brass"
            >
              Descobrir portal
            </button>
            <button
              type="button"
              id="demoBtn"
              class="cursor-pointer border-2 border-brass bg-transparent px-[22px] py-3.5 font-sans text-2xl text-brass"
            >
              Carregar demo
            </button>
          </div>
        </form>
      </section>
      <p id="error" class="min-h-[1.4em] text-[22px] text-warn" role="alert"></p>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
