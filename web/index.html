<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenFlix</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body class="bg-void font-sans text-ink antialiased selection:bg-accent selection:text-ink">
    <header
      class="sticky top-0 z-50 flex flex-wrap items-center gap-4 bg-void/85 px-4 py-3 shadow-[0_1px_8px_rgba(0,0,0,0.4)] backdrop-blur-xl md:gap-8 md:px-10 md:py-4 xl:px-14"
    >
      <a class="flex items-center gap-2" href="#home">
        <span
          id="brand"
          class="font-display text-[clamp(16px,1.2vw,20px)] font-bold tracking-wider text-accent uppercase"
          >OpenFlix</span
        >
      </a>
      <nav id="tabs" class="flex flex-wrap items-center gap-4 md:gap-6">
        <button type="button" id="tab-inicio" data-screen="home">Início</button>
        <button type="button" id="tab-live" data-catalog="live">Ao vivo</button>
        <button type="button" id="tab-movies" data-catalog="movies">Filmes</button>
        <button type="button" id="tab-series" data-catalog="series">Séries</button>
        <button type="button" id="tab-settings" data-screen="settings">Ajustes</button>
      </nav>
      <div class="relative min-w-[200px] flex-1 md:max-w-[280px]">
        <svg
          class="pointer-events-none absolute top-1/2 left-3 h-[18px] w-[18px] -translate-y-1/2 text-mute"
          viewBox="0 0 24 24"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14"
          />
        </svg>
        <input
          id="search"
          type="search"
          autocomplete="off"
          placeholder="Buscar canais ou programas"
          class="w-full rounded-lg border-0 bg-panel py-2 pr-4 pl-10 text-[14px] text-ink outline-none placeholder:text-mute focus:ring-1 focus:ring-accent"
        />
      </div>
      <div class="ml-auto flex items-center gap-3">
        <span id="hint" class="hidden text-[12px] tracking-[0.08em] text-mute lg:inline"
          >← → ↑ ↓ · Enter · Esc</span
        >
        <span
          id="signal"
          class="hidden items-center gap-1.5 rounded bg-row px-2 py-1 text-[10px] font-bold tracking-wide text-ink uppercase sm:inline-flex"
          ><span class="h-2 w-2 rounded-full bg-good"></span>OpenFlix</span
        >
        <div
          id="avatar"
          class="flex h-8 w-8 items-center justify-center overflow-hidden rounded-full bg-accent font-display text-xs font-bold text-ink"
        >
          O
        </div>
      </div>
    </header>

    <main class="px-4 pb-12 md:px-10 md:pb-16 xl:px-14">
      <section id="home" class="grid gap-8 pt-6" aria-label="Início"></section>

      <section id="catalog" class="grid gap-8 pt-6" hidden>
        <div id="catalog-grid" class="grid grid-cols-1 items-start gap-6 xl:grid-cols-12">
          <aside id="detail" class="min-w-0 xl:col-span-7"></aside>
          <div id="catalog-lists" class="flex min-w-0 flex-col gap-3 xl:col-span-5">
            <ul id="categories" class="m-0 list-none p-0"></ul>
            <ul id="items" class="m-0 list-none p-0"></ul>
          </div>
        </div>
        <div id="shelf"></div>
      </section>

      <section id="player" class="min-w-0 pt-6" hidden></section>

      <section id="settings" class="max-w-[720px] pt-6" hidden>
        <h1 class="m-0 mb-2 font-display text-[clamp(28px,2.4vw,40px)] font-bold tracking-tight">
          Ajustes
        </h1>
        <p class="mb-6 max-w-[46ch] text-[16px] text-mute">
          Playlist própria. Sem MAC, sem VPN, sem catálogo de terceiros.
        </p>
        <p class="mb-2 text-[12px] font-bold tracking-wide text-mute uppercase">Playlists salvas</p>
        <ul id="savedPlaylists" class="mb-6 flex list-none flex-wrap gap-2 p-0"></ul>
        <form id="playlistForm" class="grid w-full gap-4">
          <label class="grid gap-2 text-[14px] text-mute"
            >Nome
            <input
              id="plName"
              name="name"
              autocomplete="off"
              class="w-full rounded-lg border-0 bg-panel px-4 py-3 font-sans text-[16px] text-ink outline-none focus:ring-1 focus:ring-accent"
            />
          </label>
          <label class="grid gap-2 text-[14px] text-mute"
            >Portal
            <input
              id="plPortal"
              name="portal"
              placeholder="http://servidor:8080"
              class="w-full rounded-lg border-0 bg-panel px-4 py-3 font-sans text-[16px] text-ink outline-none focus:ring-1 focus:ring-accent"
            />
          </label>
          <label class="grid gap-2 text-[14px] text-mute"
            >Usuário
            <input
              id="plUser"
              name="username"
              autocomplete="off"
              class="w-full rounded-lg border-0 bg-panel px-4 py-3 font-sans text-[16px] text-ink outline-none focus:ring-1 focus:ring-accent"
            />
          </label>
          <label class="grid gap-2 text-[14px] text-mute"
            >Senha
            <input
              id="plPass"
              name="password"
              type="password"
              autocomplete="current-password"
              class="w-full rounded-lg border-0 bg-panel px-4 py-3 font-sans text-[16px] text-ink outline-none focus:ring-1 focus:ring-accent"
            />
          </label>
          <label class="grid gap-2 text-[14px] text-mute"
            >Lista M3U
            <input
              id="plM3u"
              name="m3u"
              placeholder="https://exemplo.com/lista.m3u"
              class="w-full rounded-lg border-0 bg-panel px-4 py-3 font-sans text-[16px] text-ink outline-none focus:ring-1 focus:ring-accent"
            />
          </label>
          <label class="grid gap-2 text-[14px] text-mute"
            >Portais para descobrir (um por linha)
            <textarea
              id="plCandidates"
              name="candidates"
              rows="3"
              placeholder="http://servidor-a.com&#10;http://servidor-b.com"
              class="w-full rounded-lg border-0 bg-panel px-4 py-3 font-sans text-[16px] text-ink outline-none focus:ring-1 focus:ring-accent"
            ></textarea>
          </label>
          <div class="flex flex-wrap gap-3">
            <button
              type="submit"
              class="cursor-pointer rounded-lg border-0 bg-action px-5 py-3 font-sans text-[16px] font-bold text-void"
            >
              Guardar XC
            </button>
            <button
              type="button"
              id="m3uBtn"
              class="cursor-pointer rounded-lg border-0 bg-row px-5 py-3 font-sans text-[16px] font-bold text-ink"
            >
              Guardar M3U
            </button>
            <button
              type="button"
              id="discoverBtn"
              class="cursor-pointer rounded-lg border-0 bg-row px-5 py-3 font-sans text-[16px] font-bold text-ink"
            >
              Descobrir portal
            </button>
            <button
              type="button"
              id="demoBtn"
              class="cursor-pointer rounded-lg border-0 bg-row px-5 py-3 font-sans text-[16px] font-bold text-ink"
            >
              Carregar demo
            </button>
          </div>
        </form>
      </section>

      <p id="error" class="mt-6 min-h-[1.4em] text-[16px] text-warn" role="alert"></p>
    </main>

    <aside
      id="pip"
      hidden
      class="fixed right-4 bottom-4 z-[60] w-[min(28vw,360px)] cursor-pointer overflow-hidden rounded-lg shadow-[0_12px_40px_rgba(0,0,0,0.6)] ring-1 ring-line"
      role="button"
      aria-label="Voltar ao player"
      tabindex="0"
    ></aside>

    <script type="module" src="./app.js"></script>
  </body>
</html>
